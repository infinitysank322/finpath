spring:
  application:
    name: finpath-api
  profiles:
    default: local
  # T29: Google sign-in as a confidential client. Credentials come from the environment only
  # (startup fails if either is empty). Google's redirect URI is Spring's default,
  # {baseUrl}/login/oauth2/code/google, and must match the one registered in the Google console.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile

# T29: FinPath's own tokens. FINPATH_JWT_SECRET (>= 32 bytes) signs HS256 access tokens; startup
# fails without it. FINPATH_AUTH_ALLOWED_REDIRECTS is the comma-separated exact-match list of
# client return URLs after sign-in. See com.finpath.auth.AuthProperties.
finpath:
  auth:
    jwt-secret: ${FINPATH_JWT_SECRET:}
    allowed-redirects: ${FINPATH_AUTH_ALLOWED_REDIRECTS:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    one-time-code-ttl: 60s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

server:
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      # Sessions exist only for the Google sign-in round trip (the API is stateless).
      timeout: 10m
      cookie:
        http-only: true
        same-site: lax

---
# The local profile lives inline because .gitignore excludes application-local.* files.
spring:
  config:
    activate:
      on-profile: local
    # Reads DB_* from the gitignored .env (repo root or api/) so `./mvnw spring-boot:run`
    # needs no exports. Real environment variables still win over these values.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    # Compose Postgres (compose.yaml), host port 5433 by default. The scheme sits in a
    # placeholder so no complete Postgres URL literal is tracked (T04 git-grep guard).
    url: jdbc:${DB_SCHEME:postgresql}://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:finpath}
    username: ${DB_USER:finpath}
    password: ${DB_PASSWORD}

finpath:
  auth:
    # The web dev server's callback unless .env says otherwise.
    allowed-redirects: ${FINPATH_AUTH_ALLOWED_REDIRECTS:http://localhost:4200/auth/callback}

server:
  port: 8080

logging:
  level:
    com.finpath: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %highlight(%-5level) %cyan(%logger{36}) - %msg%n"

---
spring:
  config:
    activate:
      on-profile: ci
  # CI has no database: the build verifies code and migrations statically (SchemaLintTest).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

logging:
  level:
    root: WARN

---
# Production config comes from the environment only; no secrets in this file.
# The datasource URL and credentials are NOT here: NeonDatasourceEnvironmentPostProcessor
# derives them (pooled URL for the app, direct URL for Flyway) from the NEON_DATABASE_URL
# environment variable, and SPRING_DATASOURCE_* overrides it. Missing config fails fast.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # HikariCP tuned for Neon scale-to-zero. The first connection after an idle suspend can take
    # many seconds while compute wakes; that is normal latency, not an error. So: wait long
    # (connection-timeout), do not fail startup on a slow first connect (initialization-fail-timeout
    # >= connection-timeout), and add no retry layer or ERROR log on the way. A truly
    # unreachable database still fails after the timeout, loudly, which is correct.
    hikari:
      pool-name: finpath-neon
      connection-timeout: 30000        # ms; a 12 s cold start must succeed (T04 test), min is 10000
      initialization-fail-timeout: 30000
      validation-timeout: 6000
      connection-test-query: SELECT 1  # explicit validation on checkout of an idle connection
      maximum-pool-size: 5             # Neon free tier and pooler connection limits are small
      minimum-idle: 0                  # let an idle pool drain so compute can suspend
      idle-timeout: 120000
      max-lifetime: 240000             # below Neon's 5 min idle suspend and pooler recycling
      keepalive-time: 0                # off on purpose: pings would stop compute scaling to zero

server:
  port: ${PORT:8080}
  shutdown: graceful
  # FORWARDED HEADERS (decision based on the code and docs/PLAN.md T84, not on the reviewer's note):
  # prod runs as one container behind a TLS-terminating reverse proxy on the same host/network, so
  # the app must honour X-Forwarded-Proto/For. `framework` (the previous value) honours them from
  # ANY client, so a directly exposed port lets callers spoof scheme, host and client address.
  # `native` uses Tomcat's RemoteIpValve, which only trusts the headers when the immediate peer
  # matches server.tomcat.remoteip.internal-proxies (Tomcat default: loopback and private ranges,
  # which covers a Docker bridge network); a public peer's headers are ignored.
  # Trade-off: any private-range peer is trusted, so never publish this port to a private LAN you
  # do not control. Tighten with SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (regex of the proxy IP),
  # or set SERVER_FORWARD_HEADERS_STRATEGY=none when no proxy is in front.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}
  servlet:
    session:
      cookie:
        secure: true   # prod is HTTPS-only behind the proxy; the sign-in session cookie never goes over http

management:
  endpoint:
    health:
      probes:
        enabled: true

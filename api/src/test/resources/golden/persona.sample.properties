# ANONYMISED SAMPLE golden fixture. Every number here is a fake round figure.
# It exists so the suite runs on a clean clone. It is NOT the product owner's data.
# Real figures live in persona.local.properties (gitignored via *.local.*), or the
# file named by FINPATH_GOLDEN_FIXTURE. Same keys, same units.
#
# Units: *_paise = whole paise (long). *_pct = percent as decimal string.
#        *_months / *_cycles / *_years = integers. *_cycle_id = yyyy-MM of the cycle.
#        *_ratio = decimal string.
#
# Home-loan keys (T11, T16) are fake but mutually consistent: a computed EMI/interest from the
# sample inputs lands within 1% of the expected values, so RulesGoldenTest passes on the sample.
# Bullet principal/monthly-interest/rate (T12) are likewise consistent: interest x 12 / principal.
# All sections are derived from the sample's own inputs (ratio = emi/income, 3-month = 3 x outflow,
# goal monthly = target/cycles, FI at 6% inflation x30, surplus later = surplus + roll-off steps).
# Any assertion run against the sample proves the wiring, not the persona figures.

# --- Home loan (amortising) ---
home.principal_paise=400000000
home.rate_pct=8.00
home.tenure_months=240
home.stated_emi_paise=3350000
home.interest_remaining_paise=402900000
home.close_months=120
home.close_emi_paise=4853100
# OQ-5 (PLAN section 7): interest saved = interest@tenure - interest@close_months.
# The BRD prose figure is rounded and is NOT what is asserted.
home.interest_saved_paise=220610000

# --- Bullet loan (interest only) ---
bullet.principal_paise=266664000
bullet.monthly_interest_paise=3333300
bullet.effective_rate_pct=15.00
bullet.due_cycle_id=2031-10
bullet.cycles_remaining=60

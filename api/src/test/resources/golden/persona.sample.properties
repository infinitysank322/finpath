rolloff.step1_cycle_id=2030-01
rolloff.step2_paise=5555500
rolloff.step2_cycle_id=2030-02
rolloff.step3_paise=6666600
rolloff.step3_cycle_id=2030-09

# --- Income, EMI ratio ---
income.monthly_paise=22222200
# T35: salary + rental must equal income.monthly_paise. Bonus is a one-off received in a cycle.
income.salary_paise=17777700
income.rental_paise=4444500
income.bonus_paise=1111100
emi.total_paise=8888800
emi.ratio=0.40

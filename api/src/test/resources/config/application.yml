# Test-classpath only (never packaged). Unit and context tests must run without a
# database, under every profile, so the datasource and Flyway stay off here. The
# local profile still migrates the compose Postgres when the app actually runs.
# A future DB-backed test opts back in explicitly (e.g. Testcontainers).
# Consequence: ProfilesTest does NOT prove the prod profile can start. Prod has no
# datasource until T04, which must add a test that the prod datasource binds from env
# without relying on this exclusion.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FinPath Add Expense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4F2EC;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0C; color: #F4F2EC; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 24px 20px 24px; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A2A2E; background: #161618; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Add expense</h1>
    <span style="font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 999px; background: #1E1E21; color: #D6D4CE">Today</span>
  </header>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 4px">
    <span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #A1A1A8">Amount</span>
    <div aria-live="polite" style="font-family: 'Space Grotesk', sans-serif; font-size: 56px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05">₹{{amountText}}</div>
    <span style="font-size: 12px; color: #A1A1A8">Safe to spend today ₹161</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #A1A1A8">Category</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{categories}}" as="c" hint-placeholder-count="6">
        <button onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="{{ c.style }}">{{ c.label }}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #A1A1A8">Was it a</span>
      <div style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #161618; border: 1px solid #2A2A2E">
        <sc-for list="{{tags}}" as="t" hint-placeholder-count="3">
          <button onClick="{{ t.pick }}" aria-pressed="{{ t.pressed }}" style="{{ t.style }}">{{ t.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #A1A1A8">Paid by</span>
      <div style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #161618; border: 1px solid #2A2A2E">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
          <button onClick="{{ m.pick }}" aria-pressed="{{ m.pressed }}" style="{{ m.style }}">{{ m.label }}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button onClick="{{ k.press }}" aria-label="{{ k.aria }}" style="height: 54px; border-radius: 16px; border: 1px solid #222225; background: #131315; color: #F4F2EC; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 500">{{ k.label }}</button>
    </sc-for>
  </div>

  <a href="Main.dc.html" style="margin-top: auto; height: 56px; border-radius: 18px; background: {{accent}}; color: #0B0B0C; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
    Save expense
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F26B","options":["#C8F26B","#8FD3FF","#F5B547"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amount: '450', category: 'Food', tag: 'Want', mode: 'UPI' };
  }
  formatIndian(raw) {
    const parts = raw.split('.');
    let i = parts[0] || '0';
    if (i.length > 3) {
      const last = i.slice(-3);
      let rest = i.slice(0, -3);
      const groups = [];
      while (rest.length > 2) { groups.unshift(rest.slice(-2)); rest = rest.slice(0, -2); }
      if (rest.length) groups.unshift(rest);
      i = groups.join(',') + ',' + last;
    }
    return parts.length > 1 ? i + '.' + parts[1] : i;
  }
  press(key) {
    let a = this.state.amount;
    if (key === 'del') { a = a.length > 1 ? a.slice(0, -1) : '0'; }
    else if (key === '.') { if (a.indexOf('.') === -1) a = a + '.'; }
    else {
      if (a.indexOf('.') !== -1 && a.split('.')[1].length >= 2) return;
      if (a.replace('.', '').length >= 8) return;
      a = a === '0' ? key : a + key;
    }
    this.setState({ amount: a });
  }
  renderVals() {
    const accent = this.props.accent ?? '#C8F26B';
    const s = this.state;
    const chip = (on) => 'height: 44px; border-radius: 14px; font-family: inherit; font-size: 13px; font-weight: 700; ' +
      (on ? 'background: ' + accent + '; color: #0B0B0C; border: 1px solid ' + accent + ';'
          : 'background: #161618; color: #D6D4CE; border: 1px solid #2A2A2E;');
    const seg = (on) => 'flex: 1; height: 38px; border-radius: 10px; border: 0; font-family: inherit; font-size: 12px; font-weight: 700; ' +
      (on ? 'background: #F4F2EC; color: #0B0B0C;' : 'background: transparent; color: #A1A1A8;');
    const categories = ['Groceries', 'Food', 'Fuel', 'Bills', 'Shopping', 'Health'].map((label) => ({
      label, pressed: String(s.category === label), style: chip(s.category === label),
      pick: () => this.setState({ category: label })
    }));
    const tags = ['Need', 'Want', 'Waste'].map((label) => ({
      label, pressed: String(s.tag === label), style: seg(s.tag === label),
      pick: () => this.setState({ tag: label })
    }));
    const modes = ['UPI', 'Card', 'Cash'].map((label) => ({
      label, pressed: String(s.mode === label), style: seg(s.mode === label),
      pick: () => this.setState({ mode: label })
    }));
    const keyList = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'del'];
    const keys = keyList.map((k) => ({
      label: k === 'del' ? '⌫' : k,
      aria: k === 'del' ? 'Delete digit' : (k === '.' ? 'Decimal point' : k),
      press: () => this.press(k)
    }));
    return { accent, amountText: this.formatIndian(s.amount), categories, tags, modes, keys };
  }
}
</script>
</body>
</html>

<div class="fp-page">
  <fp-page-header title="Add expense" [centered]="true">
    <a fpLeading class="icon-btn" routerLink="/home" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <span fpTrailing class="today">Today</span>
  </fp-page-header>

  <section class="amount-block" aria-labelledby="amt-h">
    <span id="amt-h" class="fp-label">Amount</span>
    <p class="amount fp-num" role="status">
      <span class="sr-only">Amount {{ amountLabel() }}</span>
      <span aria-hidden="true">₹{{ amountShown() }}</span>
    </p>
  </section>

  <section class="block">
    <span class="fp-label" aria-hidden="true">Category</span>
    <fp-chip-grid label="Category" ariaPrefix="Category " [options]="categoryOptions" [value]="category()" (valueChange)="category.set($event)" />
  </section>

  <section class="block">
    <span class="fp-label" aria-hidden="true">Paid by</span>
    <fp-chip-grid label="Paid by" ariaPrefix="Payment mode " [options]="modeOptions" [value]="mode()" (valueChange)="onMode($event)" />
  </section>

  <section class="block">
    <span class="fp-label" aria-hidden="true">Tag (optional)</span>
    <fp-segmented label="Tag, optional" ariaPrefix="Tag " [options]="tagOptions" [value]="tag()" [deselectable]="true" (valueChange)="onTag($event)" />
  </section>

  <fp-keypad label="Amount keypad" (keyPress)="press($event)" />

  <section class="block">
    <label class="fp-field">
      <span class="fp-label">Note</span>
      <input
        class="fp-input"
        type="text"
        maxlength="140"
        autocomplete="off"
        aria-label="Note"
        aria-describedby="note-hint"
        [value]="note()"
        (input)="onNote($event)"
      />
    </label>
    <p id="note-hint" class="muted hint">Do not enter account, card or ID numbers.</p>
  </section>

  <p class="error fp-alert" role="alert">{{ error() }}</p>
  @if (signInNeeded()) {
    <button type="button" class="fp-btn fp-btn-ghost" (click)="signInToSave()">Sign in to save</button>
  }
  <p class="ok" role="status">{{ message() }}</p>

  <app-pending-expenses />

  <div class="savebar">
    <button type="button" class="fp-btn fp-btn-block" aria-label="Save expense" [disabled]="!canSave()" (click)="save()">
      Save expense
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
  </div>
</div>

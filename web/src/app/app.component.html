<a class="skip" href="#main">Skip to content</a>
<header class="bar">
  <span class="brand">FinPath</span>
  <button
    type="button"
    class="theme-toggle"
    (click)="themeService.toggle()"
    [attr.aria-pressed]="themeService.theme() === 'dark'"
    aria-label="Dark mode"
  >
    {{ themeService.theme() === 'dark' ? 'Dark' : 'Light' }}
  </button>
</header>
<main id="main" tabindex="-1">
  <router-outlet />
</main>
<nav class="tabs" aria-label="Primary">
  @for (item of nav; track item.path) {
    <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path [attr.d]="item.icon" fill="currentColor" /></svg>
      <span>{{ item.label }}</span>
    </a>
  }
</nav>
